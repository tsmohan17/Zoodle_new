name: Build Zoodle Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Setup Gradle Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make Gradle Executable
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk zoodle.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: zoodle-android-apk
          path: zoodle.apk

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v1.0.0
          name: "Zoodle Android APK v1.0.0"
          body: |
            🎨 **Zoodle - Multiplayer Scribble Game with WhatsApp-grade Video Conferencing**
            
            ### 📱 Installation Instructions:
            1. Download `zoodle.apk` on your Android device.
            2. Tap the file to install (allow install from browser/unknown sources if prompted).
            3. Enjoy full-screen native scribble gaming with live video calls!
          files: zoodle.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

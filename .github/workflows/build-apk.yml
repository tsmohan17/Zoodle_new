name: Build Zoodle Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Install Android SDK Platform 35 & Accept Licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" || true
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Make Gradle Executable
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Copy & Rename APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk zoodle.apk
          ls -lh zoodle.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: zoodle-android-apk
          path: zoodle.apk

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v1.0.4
          name: "Zoodle Native Android App v1.0.4"
          body: |
            🎨 **Zoodle - Multiplayer Scribble Game with WhatsApp-grade Video Conferencing**
            
            ### 📱 Download & Install Instructions:
            1. Download the `zoodle.apk` file attached below.
            2. On your Android phone, tap the downloaded APK to install.
            3. Enjoy full-screen native scribble gaming with live video calls!
          files: zoodle.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
